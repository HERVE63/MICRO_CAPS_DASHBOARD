name: MICRO CAPS - RECENSEMENT US COMPLET EODHD
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recensement_us_eodhd.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: microcaps-recensement-eodhd
  cancel-in-progress: false
jobs:
  recensement:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas cryptography
      - name: Tests hors réseau
        run: python -B TESTS/executer_tests.py
      - name: Protection des archives fournisseur
        run: python -B TESTS/verifier_chiffrement_eodhd.py
      - name: Recensement catalogue américain complet et fondamentaux
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -B SCRIPTS_ACTIFS/07AH_RECENSER_MICROCAPS_US_EODHD.py
      - name: Intégrité du T0 et des dossiers
        if: always()
        run: |
          python -B SCRIPTS_ACTIFS/07AC_CONTROLER_T0.py
          git diff --exit-code -- DONNEES SAUVEGARDES
      - name: Préserver le bilan et les archives chiffrées
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recensement-us-eodhd-${{ github.run_id }}-${{ github.run_attempt }}
          path: AUDITS/RECENSEMENT_US_EODHD/
          retention-days: 90
      - name: Sauvegarder les preuves et le diagnostic
        if: always()
        run: |
          rapport="AUDITS/TESTS/RUN_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$rapport" AUDITS/RECENSEMENT_US_EODHD
          if [ -f AUDITS/TESTS/RESULTATS_TESTS.json ]; then
            cp AUDITS/TESTS/RESULTATS_TESTS.json "$rapport/RESULTATS_TESTS.json"
            git restore --worktree AUDITS/TESTS/RESULTATS_TESTS.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AUDITS/RECENSEMENT_US_EODHD AUDITS/TESTS
          if ! git diff --cached --quiet; then
            git commit -m 'Recensement US EODHD : état réel et archives protégées'
            git pull --rebase origin main
            git push origin main
          fi
