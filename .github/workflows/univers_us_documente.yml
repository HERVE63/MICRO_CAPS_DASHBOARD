name: MICRO CAPS - DOCUMENTS UNIVERS US RECENSE
on:
  push:
    branches: [main]
    paths: ['.github/workflows/univers_us_documente.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: microcaps-us-documente
  cancel-in-progress: false
jobs:
  documents-us:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas cryptography
      - name: Tests hors réseau et intégrité des entrées
        run: python -B TESTS/executer_tests.py
      - name: Raccorder tout le recensement US aux pièces réglementaires et contrôler les documents
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY || secrets.EODH_API_KEY }}
        run: python -u -B SCRIPTS_ACTIFS/07AJ_ETENDRE_DOCUMENTS_SEC_UNIVERS_US.py
      - name: Contrôle du T0
        if: always()
        run: |
          python -B SCRIPTS_ACTIFS/07AC_CONTROLER_T0.py
          git diff --exit-code -- DONNEES SAUVEGARDES
      - name: Préserver les résultats même en cas d'échec
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: univers-us-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            AUDITS/PROFILS_SEC_UNIVERS_US/
            AUDITS/DOCUMENTS_US/
            AUDITS/CONTROLE_DOCUMENTS_US/
            AUDITS/TESTS/RESULTATS_TESTS.json
          retention-days: 90
      - name: Sauvegarder les audits sans modifier les dossiers
        if: always()
        run: |
          rapport="AUDITS/TESTS/RUN_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          if [ -f AUDITS/TESTS/RESULTATS_TESTS.json ]; then
            mkdir -p "$rapport"
            cp AUDITS/TESTS/RESULTATS_TESTS.json "$rapport/RESULTATS_TESTS.json"
            git restore --worktree AUDITS/TESTS/RESULTATS_TESTS.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p AUDITS/PROFILS_SEC_UNIVERS_US AUDITS/DOCUMENTS_US AUDITS/CONTROLE_DOCUMENTS_US
          git add AUDITS/PROFILS_SEC_UNIVERS_US AUDITS/DOCUMENTS_US AUDITS/CONTROLE_DOCUMENTS_US AUDITS/TESTS
          if ! git diff --cached --quiet; then
            git commit -m 'Documents SEC du recensement US : profils, pièces et contrôles sauvegardés'
            git pull --rebase origin main
            git push origin main
          fi
