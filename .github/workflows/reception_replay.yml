name: MICRO CAPS - RECEPTION REPLAY
on:
  push:
    branches: [main]
    paths:
      - "SCRIPTS_ACTIFS/05C_REPLAY_PORTEFEUILLE_GERE.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - run: python SCRIPTS_ACTIFS/05C_REPLAY_PORTEFEUILLE_GERE.py
