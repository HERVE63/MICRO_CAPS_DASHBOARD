name: MICRO CAPS - RESOLUTION EUROPE
on:
  push:
    paths:
      - 'SCRIPTS_ACTIFS/07I_RESOLUTION_EUROPE_SECONDAIRES.py'
      - '.github/workflows/resolution_europe_microcaps.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python SCRIPTS_ACTIFS/07I_RESOLUTION_EUROPE_SECONDAIRES.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DONNEES/RESOLUTION_EUROPE_SECONDAIRES.csv DONNEES/SYNTHESE_RESOLUTION_EUROPE.csv
          git diff --cached --quiet || git commit -m "Actualise resolution Europe"
          git pull --rebase origin main
          git push origin main
