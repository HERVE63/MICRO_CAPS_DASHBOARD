name: Collecte directe des 40 titulaires (isolée, sans notation)
on:
  workflow_dispatch:
  push:
    branches: [repair/microcaps-chain-20261030]
    paths:
      - '.github/workflows/collecte-40-titulaires.yml'
      - 'SCRIPTS_ACTIFS/09D_COLLECTE_40_TITULAIRES.py'
permissions:
  contents: read
jobs:
  collecter:
    if: github.ref_name == 'repair/microcaps-chain-20261030'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas requests
      - name: Tester plan B EODHD hors reseau avant toute collecte reelle
        run: python -B TESTS/test_09d_collecte_non_bloquante.py
      - name: Diagnostiquer acces EODHD sans bloquer les 40 dossiers
        id: diagnostic
        continue-on-error: true
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_KEY || secrets.EODH_API_KEY }}
        run: python -B SCRIPTS_ACTIFS/09E_TEST_ACCES_EODHD.py
      - name: Collecter les 40 titulaires et isoler les echecs par ligne
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_KEY || secrets.EODH_API_KEY }}
        run: python -B SCRIPTS_ACTIFS/09D_COLLECTE_40_TITULAIRES.py
      - name: Controler la couverture et interdire toute qualification fictive
        run: |
          python - <<'PY'
          import pandas as pd
          p = 'DONNEES/COLLECTE_DIRECTE_40_TITULAIRES.csv'
          d = pd.read_csv(p, dtype=str, keep_default_na=False)
          assert len(d) == 40 and d['ID_position'].nunique() == 40
          assert (d['Preuve_primaire_validee'] == 'NON').all()
          assert (d['Score_SSI'] == 'MANQUANTE').all()
          assert (d['Score_MCPA'] == 'MANQUANTE').all()
          print('COUVERTURE_40', len(d), 'QUALIFICATIONS=0; ARBITRAGE_INTERDIT')
          print('STATUTS', d['Statut'].value_counts().to_dict())
          PY
      - name: Verifier les SHA256 de toutes les reponses reelles archivees
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import pandas as pd

          dossiers = sorted(Path('AUDITS/HISTORIQUE_COLLECTES_HEBDOMADAIRES').glob('COLLECTE_40_*'))
          assert len(dossiers) == 1, f'Attendu 1 lot isole, trouve {len(dossiers)}'
          dossier = dossiers[0]
          manifeste = json.loads((dossier / 'MANIFESTE.json').read_text(encoding='utf-8'))
          assert manifeste['nombre_positions'] == 40
          assert manifeste['preuves_primaires_validees'] == 0
          assert manifeste['scores_attribues'] == 0
          assert manifeste['arbitrage_autorise'] is False
          empreintes = manifeste['fichiers_sha256']
          assert empreintes, 'Manifeste de reponses vide'
          for rel, sha in empreintes.items():
              cible = (dossier / rel).resolve()
              assert cible.is_relative_to(dossier.resolve()), 'Chemin archive hors lot'
              assert cible.is_file(), f'Archive manquante : {rel}'
              assert hashlib.sha256(cible.read_bytes()).hexdigest() == sha, f'SHA256 divergent : {rel}'
          eod = sum(rel.endswith('_EOD.json') for rel in empreintes)
          recherches = sum(rel.endswith('_SEARCH.json') for rel in empreintes)
          assert eod == manifeste['cours_EOD_observes'] + manifeste['cours_EOD_conflits']
          assert recherches <= manifeste['recherches_identite_404']
          donnees = pd.read_csv('DONNEES/COLLECTE_DIRECTE_40_TITULAIRES.csv',
                                dtype=str, keep_default_na=False)
          conflits = donnees[donnees['Statut_cours'] == 'EN_ATTENTE_DATA_COURS_CONFLIT']
          assert len(conflits) == manifeste['cours_EOD_conflits']
          if not conflits.empty:
              assert (conflits['Cours_ajuste_fournisseur'] == '').all()
              assert (conflits['Anomalie_cours'] == 'CLOTURE_MULTIPLE_CONTRADICTOIRE').all()
              assert (conflits['Score_SSI'] == 'MANQUANTE').all()
              assert (conflits['Score_MCPA'] == 'MANQUANTE').all()
          non_trouves = donnees[donnees['HTTP_cours'] == '404']
          assert (non_trouves['Statut_cours'] != 'COURS_FOURNISSEUR_NON_CERTIFIE').all()
          assert (non_trouves['Score_SSI'] == 'MANQUANTE').all()
          assert (non_trouves['Score_MCPA'] == 'MANQUANTE').all()
          print('SHA256_REELS_VALIDES', len(empreintes),
                'EOD', eod, 'RECHERCHES', recherches,
                'HTTP404', len(non_trouves), 'EOD_CONFLITS', len(conflits), 'ADMISSIONS', 0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: donnees-directes-40-titulaires
          path: |
            DONNEES/COLLECTE_DIRECTE_40_TITULAIRES.csv
            AUDITS/HISTORIQUE_COLLECTES_HEBDOMADAIRES/COLLECTE_40_*/
