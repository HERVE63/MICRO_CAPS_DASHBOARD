name: Collecte directe des 40 titulaires
on:
  workflow_dispatch:
  push:
    branches: [repair/microcaps-chain-20261030]
    paths:
      - 'SCRIPTS_ACTIFS/09D_COLLECTE_40_TITULAIRES.py'
      - '.github/workflows/collecte-40-titulaires.yml'
jobs:
  collecter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas requests
      - run: python SCRIPTS_ACTIFS/09D_COLLECTE_40_TITULAIRES.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: donnees-directes-40-titulaires
          path: DONNEES/COLLECTE_DIRECTE_40_TITULAIRES.csv
