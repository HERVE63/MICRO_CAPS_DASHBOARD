name: MICRO CAPS - CAPTURE PRIMAIRE ICAPE ISOLEE
on:
  workflow_dispatch:
  push:
    branches: [repair/microcaps-chain-20261030]
    paths:
      - 'CONFIG/DOCUMENTS_OFFICIELS_ICAPE_A_COLLECTER.csv'
      - 'SCRIPTS_ACTIFS/07AA_COLLECTE_DOCUMENTS_OFFICIELS.py'
      - 'TESTS/test_sources_officielles_hors_reseau.py'
      - '.github/workflows/collecte_icape_primaires_isolee.yml'
permissions:
  contents: write
concurrency:
  group: microcaps-icape-primaires-isolees
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - name: Tester le collecteur historique hors reseau
        run: python -B TESTS/test_sources_officielles_hors_reseau.py
      - name: Capturer les deux sources officielles sans aucune note
        run: |
          python -B SCRIPTS_ACTIFS/07AA_COLLECTE_DOCUMENTS_OFFICIELS.py \
            --registre CONFIG/DOCUMENTS_OFFICIELS_ICAPE_A_COLLECTER.csv \
            --couverture DONNEES/DOSSIERS_SSI_A_QUALIFIER.csv
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          audits=sorted(Path('AUDITS/SOURCES_OFFICIELLES').glob('*/AUDIT_DOCUMENTS.csv'))
          assert audits, 'Aucun audit de capture produit'
          df=pd.read_csv(audits[-1],dtype=str,keep_default_na=False)
          assert len(df)==2 and df['Notes_attribuees'].eq('0').all()
          assert df['Statut_identite'].str.startswith('A_VERIFIER').all()
          print('CAPTURE_ICAPE_STATUTS',df[['ID_document','Statut','Motif']].to_json(orient='records') if 'Motif' in df else df[['ID_document','Statut']].to_json(orient='records'))
          print('CERTIFICATION_SCE=NON ; SSI=MANQUANTE ; aucune promotion automatique')
          PY
      - name: Verifier isolation des donnees de production
        if: always()
        run: |
          git diff --exit-code -- DONNEES HISTORIQUE SAUVEGARDES APPLICATION index.html
      - name: Conserver les documents et audits meme en cas de source bloquee
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icape-primaires-${{ github.run_id }}-${{ github.run_attempt }}
          path: AUDITS/SOURCES_OFFICIELLES/
          if-no-files-found: warn
      - name: Publier exclusivement les captures sur branche de reparation
        if: ${{ success() && github.ref_name == 'repair/microcaps-chain-20261030' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AUDITS/SOURCES_OFFICIELLES
          if ! git diff --cached --quiet; then
            git commit -m "Capture ICAPE: documents bruts, provenance et SHA256 non certifies"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
