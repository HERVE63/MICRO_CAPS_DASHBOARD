name: MICRO CAPS - RACCORDEMENT COMPTES US SSI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/raccordement_comptes_us_ssi.yml']
  workflow_run:
    workflows: ['MICRO CAPS - RECENSEMENT US COMPLET EODHD']
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: microcaps-raccordement-us
  cancel-in-progress: false
jobs:
  raccordement:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas cryptography
      - name: Réception hors réseau
        run: python -B TESTS/executer_tests.py
      - name: Raccorder les archives SEC aux modules financiers existants
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY || secrets.EODH_API_KEY }}
        run: python -B SCRIPTS_ACTIFS/07AI_RACCORDER_COMPTES_US_SSI.py
      - name: Intégrité du T0 et des entrées
        if: always()
        run: |
          python -B SCRIPTS_ACTIFS/07AC_CONTROLER_T0.py
          git diff --exit-code -- DONNEES SAUVEGARDES
      - name: Archiver les résultats effectifs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raccordement-comptes-us-${{ github.run_id }}-${{ github.run_attempt }}
          path: AUDITS/QUALIFICATION_US/
          retention-days: 90
      - name: Préserver les preuves financières et la réception
        if: always()
        run: |
          rapport="AUDITS/TESTS/RUN_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$rapport" AUDITS/QUALIFICATION_US
          if [ -f AUDITS/TESTS/RESULTATS_TESTS.json ]; then
            cp AUDITS/TESTS/RESULTATS_TESTS.json "$rapport/RESULTATS_TESTS.json"
            git restore --worktree AUDITS/TESTS/RESULTATS_TESTS.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AUDITS/QUALIFICATION_US AUDITS/TESTS
          if ! git diff --cached --quiet; then
            git commit -m 'Raccorder les comptes US SEC : faits, périodes et pistes SSI sans notation'
            git pull --rebase origin main
            git push origin main
          fi
