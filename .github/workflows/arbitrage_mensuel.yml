name: MICRO CAPS - ARBITRAGE MENSUEL
on:
  workflow_dispatch:
  schedule:
    - cron: "45 21 * * 2"
    - cron: "45 22 * * 2"
permissions:
  contents: write
concurrency:
  group: microcaps-production-quotidienne
  cancel-in-progress: false
jobs:
  arbitrage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          sparse-checkout: SCRIPTS_ACTIFS/00A_PLANIFICATION_QUOTIDIENNE.py
          sparse-checkout-cone-mode: false
      - name: Vérifier le réveil mensuel sans dépendre de la minute réelle
        id: horaire
        env:
          MICRO_CAPS_CRON: ${{ github.event.schedule }}
          MICRO_CAPS_PLANIFICATION_MODE: MENSUEL
        run: python3 -B SCRIPTS_ACTIFS/00A_PLANIFICATION_QUOTIDIENNE.py
      - if: steps.horaire.outputs.run == 'true'
        uses: actions/checkout@v4
      - name: Désactiver le checkout partiel pour la chaîne mensuelle
        if: steps.horaire.outputs.run == 'true'
        run: |
          git sparse-checkout disable
          test -f SCRIPTS_ACTIFS/10_EXECUTION_MENSUELLE.py
      - if: steps.horaire.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.horaire.outputs.run == 'true'
        run: pip install pandas numpy yfinance pandas_market_calendars
      - if: steps.horaire.outputs.run == 'true'
        run: |
          python SCRIPTS_ACTIFS/10_EXECUTION_MENSUELLE.py
          python SCRIPTS_ACTIFS/00_EXECUTION_QUOTIDIENNE_V3.py
          python SCRIPTS_ACTIFS/08_GENERER_DASHBOARD.py
      - name: Sauvegarder
        if: steps.horaire.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DONNEES HISTORIQUE index.html APPLICATION/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Arbitrage mensuel MICRO CAPS"
            # Les sorties non retenues ne doivent pas bloquer le rebase.
            # Ne modifie aucun coffre maître ni historique officiel hors commit validé.
            git reset --hard HEAD
            git clean -fd
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
