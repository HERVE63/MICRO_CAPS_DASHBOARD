name: Micro Caps - lectures Zonebourse et momentum 1 2 3 mois
on:
  workflow_dispatch:
  push:
    branches: [repair/microcaps-chain-20261030]
    paths:
      - 'DONNEES/ZONEBOURSE_NAVIGATEUR/**'
      - 'SCRIPTS_ACTIFS/40M_MOMENTUM_EXPERIENCE.py'
      - 'tests/test_40m_momentum_experience_integration.py'
      - '.github/workflows/microcaps-momentum-quotidien.yml'
permissions:
  contents: write
concurrency:
  group: microcaps-momentum-zonebourse
  cancel-in-progress: false
jobs:
  tests-et-calculs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: python -m pip install pandas pandas_market_calendars pytest
      - name: Tester les vrais relevés et les refus de données périmées
        run: python -m pytest -q tests/test_40m_momentum_experience_integration.py
      - name: Vérifier le T0 et exécuter le moteur sur les lectures du jour
        run: |
          python SCRIPTS_ACTIFS/07AC_CONTROLER_T0.py
          python SCRIPTS_ACTIFS/40M_MOMENTUM_EXPERIENCE.py
      - name: Archiver résultats et preuves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microcaps-zonebourse-${{ github.run_id }}
          path: |
            DONNEES/ZONEBOURSE_NAVIGATEUR/
            DONNEES/EXPERIENCE_MOMENTUM_40.csv
            DONNEES/ETAT_MOMENTUM_QUOTIDIEN.json
            DONNEES/PREPARATION_HEBDOMADAIRE_MOMENTUM_40.csv
      - name: Sauvegarder les calculs sur la branche de travail
        if: success()
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          git fetch origin repair/microcaps-chain-20261030
          if [ "$(git rev-parse FETCH_HEAD)" != "$EXPECTED_HEAD" ]; then
            echo 'Branche avancée : résultats conservés dans l’artefact, sans écraser un passage plus récent.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DONNEES/EXPERIENCE_MOMENTUM_40.csv DONNEES/ETAT_MOMENTUM_QUOTIDIEN.json DONNEES/PREPARATION_HEBDOMADAIRE_MOMENTUM_40.csv
          if ! git diff --cached --quiet; then
            git commit -m "data: calculs momentum depuis lectures Zonebourse [skip ci]"
            git push origin HEAD:repair/microcaps-chain-20261030
          fi
      - name: Vérifier la couverture actuelle distinctement des tests logiciels
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('DONNEES/ETAT_MOMENTUM_QUOTIDIEN.json').read_text())
          print(json.dumps(r,ensure_ascii=False))
          if r['lectures_exploitables']!=40:
              raise SystemExit('COLLECTE INCOMPLETE : '+str(r['lectures_exploitables'])+'/40. Tests logiciels exécutés ; aucun arbitrage autorisé.')
          PY
