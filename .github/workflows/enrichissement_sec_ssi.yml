name: MICRO CAPS - ENRICHISSEMENT SEC SSI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enrichissement_sec_ssi.yml'
  workflow_dispatch:
    inputs:
      offset:
        description: 'Offset du lot US trié par ticker (aucune présélection économique)'
        default: '0'
      taille:
        description: 'Nombre maximum de dossiers US dans ce lot'
        default: '100'
permissions:
  contents: write
concurrency:
  group: microcaps-sec-audit
  cancel-in-progress: false
jobs:
  sec-ssi:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - name: Réception hors réseau avant collecte
        run: python -B TESTS/executer_tests.py
      - name: Collecte SEC isolée, preuves brutes et contrôle du secret
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SEC_BATCH_OFFSET: ${{ inputs.offset || '0' }}
          SEC_BATCH_SIZE: ${{ inputs.taille || '100' }}
        run: python -B SCRIPTS_ACTIFS/07Z_EXECUTION_SEC_AUDITEE.py
      - name: Collecte officielle hors SEC et bilan de qualification
        if: always()
        run: |
          python -B SCRIPTS_ACTIFS/07AA_COLLECTE_DOCUMENTS_OFFICIELS.py
          python -B SCRIPTS_ACTIFS/07AB_BILAN_SELECTION_DOCUMENTEE.py
      - name: Isoler le compte rendu de cette exécution
        if: always()
        run: |
          rapport="AUDITS/TESTS/RUN_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          if [ -f AUDITS/TESTS/RESULTATS_TESTS.json ]; then
            mkdir -p "$rapport"
            cp AUDITS/TESTS/RESULTATS_TESTS.json "$rapport/RESULTATS_TESTS.json"
            git restore --worktree AUDITS/TESTS/RESULTATS_TESTS.json
          fi
      - name: Conserver les audits y compris les échecs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preuves-sec-ssi-${{ github.run_id }}-${{ github.run_attempt }}
          path: AUDITS/
          if-no-files-found: error
          retention-days: 90
      - name: Sauvegarder les preuves sans modifier les entrées
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AUDITS/SEC AUDITS/TESTS AUDITS/SOURCES_OFFICIELLES AUDITS/SELECTION
          if ! git diff --cached --quiet; then
            git commit -m 'Audit SEC SSI : preuves et statut effectif'
            git pull --rebase origin main
            git push origin main
          fi
