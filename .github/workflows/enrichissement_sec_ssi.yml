name: MICRO CAPS - ENRICHISSEMENT SEC SSI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sec-ssi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - name: Collecter les references SEC sans notation
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python SCRIPTS_ACTIFS/07T_ENRICHIR_PREUVES_SEC_EDGAR.py
          python SCRIPTS_ACTIFS/07U_COLLECTE_COMPANYFACTS_SEC.py
          python SCRIPTS_ACTIFS/07V_NORMALISER_FAITS_SEC.py
          python SCRIPTS_ACTIFS/07W_RAPPROCHER_PREUVES_SEC_SSI.py
      - uses: actions/upload-artifact@v4
        with:
          name: preuves-sec-ssi
          path: |
            DONNEES/PREUVES_SEC_EDGAR_SSI.csv
            DONNEES/AUDIT_PREUVES_SEC_SSI.csv
            DONNEES/FAITS_FINANCIERS_SEC_SSI.csv
            DONNEES/AUDIT_FAITS_FINANCIERS_SEC_SSI.csv
            DONNEES/FAITS_SEC_COMPARABLES_SSI.csv
            DONNEES/AUDIT_COMPARABILITE_SEC_SSI.csv
            DONNEES/RAPPROCHEMENT_PREUVES_SEC_SSI.csv
            DONNEES/AUDIT_RAPPROCHEMENT_SEC_SSI.csv
          if-no-files-found: error
