name: Replay 05C isolated validation
on:
  push:
    branches:
      - repair/microcaps-chain-20261030
  pull_request:
  workflow_dispatch:
jobs:
  replay-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas pytest
      - run: python -m pytest -q tests/test_replay_05c_isolation_smoke.py tests/test_replay_05c_sale_purchase_isolated.py
