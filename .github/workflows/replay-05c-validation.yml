name: Replay 05C isolated validation
on:
  push:
    branches:
      - repair/microcaps-chain-20261030
  pull_request:
  workflow_dispatch:
jobs:
  replay-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas pytest requests
      - name: Collecter les fondamentaux EODHD des 40 titulaires
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: python SCRIPTS_ACTIFS/09D_COLLECTE_40_TITULAIRES.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collecte-directe-40
          path: DONNEES/COLLECTE_DIRECTE_40_TITULAIRES.csv
      - run: python SCRIPTS_ACTIFS/09C_AUDIT_RACCORDEMENT_TITULAIRES.py
      - uses: actions/upload-artifact@v4
        with:
          name: audit-raccordement-titulaires
          path: DONNEES/AUDIT_RACCORDEMENT_40_TITULAIRES.csv
      - run: python -m pytest -q tests/test_replay_05c_isolation_smoke.py tests/test_replay_05c_sale_purchase_isolated.py
