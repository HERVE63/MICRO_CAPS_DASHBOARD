name: MICRO CAPS - historiques publics 40 titulaires
on:
  workflow_dispatch:
  push:
    branches: [repair/microcaps-chain-20261030]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  collect-histories:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test de résilience 09N hors réseau
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_09n_collecte_historique_isolee.py
      - name: Collecte publique sans clé
        run: python -B SCRIPTS_ACTIFS/09N_COLLECTE_HISTORIQUES_YAHOO_40.py
      - name: Contrôle de couverture et preuves
        run: python -B SCRIPTS_ACTIFS/09P_COUVERTURE_PREUVES_40.py
      - name: Alimenter le dépôt opérationnel avec les données calculées
        if: github.event_name == 'push' && github.ref == 'refs/heads/repair/microcaps-chain-20261030'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DONNEES/HISTORIQUES_YAHOO_40.csv DONNEES/COUVERTURE_HISTORIQUES_YAHOO_40.csv DONNEES/INDICATEURS_YAHOO_40.csv DONNEES/COUVERTURE_PREUVE_MCPA_40.csv
          if ! git diff --cached --quiet; then
            git commit -m "data: actualiser historiques et preuves des 40 titulaires [skip ci]"
            git push origin HEAD:repair/microcaps-chain-20261030
          fi
      - name: Archiver résultats et couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historiques-40-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            DONNEES/HISTORIQUES_YAHOO_40.csv
            DONNEES/COUVERTURE_HISTORIQUES_YAHOO_40.csv
            DONNEES/INDICATEURS_YAHOO_40.csv
            DONNEES/COUVERTURE_PREUVE_MCPA_40.csv
          retention-days: 30
