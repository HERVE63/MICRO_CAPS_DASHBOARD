name: MICRO CAPS - CONTROLE PRE SSI
on:
  push:
    paths:
      - 'SCRIPTS_ACTIFS/07O_CONTROLE_PRE_SSI.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python SCRIPTS_ACTIFS/07O_CONTROLE_PRE_SSI.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DONNEES/CANDIDATS_PRETS_SSI.csv DONNEES/CANDIDATS_SSI_DONNEES_MANQUANTES.csv DONNEES/AUDIT_PRE_SSI.csv
          git diff --cached --quiet || git commit -m "Controle pre SSI Micro Caps"
          git pull --rebase origin main
          git push origin main
