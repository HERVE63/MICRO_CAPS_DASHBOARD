name: MICRO CAPS - CONSOLIDATION SEC REELLE ISOLEE
on:
  push:
    branches: [repair/microcaps-chain-20261030]
    paths:
      - .github/workflows/consolidation_sec_reelle_isolee.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consolidation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            SCRIPTS_ACTIFS
            DONNEES
            AUDITS/SEC
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy
      - name: Consolider les archives SEC reelles avec controle SHA256 des sources
        run: python -B SCRIPTS_ACTIFS/07AD_CONSOLIDER_COLLECTES_SEC.py
      - name: Verifier les 40 titulaires, aucune note et sceller les resultats
        run: |
          python - <<'PY'
          import csv,hashlib,json,pathlib
          root=pathlib.Path('AUDITS/SEC_CONSOLIDE')
          dossiers=sorted(root.glob('*/MANIFESTE.json'))
          assert len(dossiers)==1, 'Une seule consolidation attendue'
          manifeste=dossiers[0]
          bilan=json.loads(manifeste.read_text())
          assert bilan['titulaires_couverts']==40, bilan
          assert bilan['notes_attribuees']==0 and bilan['identites_validees_automatiquement']==0
          assert bilan['archives_controlees']>=1, bilan
          sortie=manifeste.parent
          with (sortie/'COUVERTURE_TITULAIRES.csv').open(newline='') as f:
              lignes=list(csv.DictReader(f))
          assert len(lignes)==40 and len({r['ID_position'] for r in lignes})==40
          assert all(r['Statut_SSI']=='EN_ATTENTE_DATA' and r['Statut_MCPA']=='EN_ATTENTE_DATA' for r in lignes)
          empreintes={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(sortie.glob('*')) if p.is_file()}
          (sortie/'SHA256_RESULTATS.json').write_text(json.dumps(empreintes,indent=2,sort_keys=True)+'\n')
          print('CONSOLIDATION REELLE :',json.dumps(bilan,ensure_ascii=False),flush=True)
          print('SHA256 RESULTATS :',json.dumps(empreintes,sort_keys=True),flush=True)
          PY
      - name: Interdire toute mutation des references et de main
        run: |
          git diff --exit-code -- DONNEES AUDITS/SEC HISTORIQUE CONFIG
          test -z "$(git status --porcelain -- DONNEES HISTORIQUE CONFIG AUDITS/SEC)"
      - uses: actions/upload-artifact@v4
        with:
          name: consolidation-sec-reelle-auditee
          path: AUDITS/SEC_CONSOLIDE/
          if-no-files-found: error
          retention-days: 30
