name: Audit lecture seule raccordement Micro Caps
on:
  push:
    branches:
      - repair/microcaps-chain-20261030
    paths:
      - 'SCRIPTS_ACTIFS/09G_AUDIT_RACCORDEMENT.py'
      - '.github/workflows/audit-raccordement-microcaps.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - name: Tester l'import chasse dans le runner sans commit
        run: python SCRIPTS_ACTIFS/08A_IMPORT_SCREENER.py
      - name: Controler les interfaces existantes sans arbitrer
        run: python SCRIPTS_ACTIFS/09G_AUDIT_RACCORDEMENT.py
