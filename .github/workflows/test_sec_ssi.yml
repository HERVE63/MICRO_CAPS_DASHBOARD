name: MICRO CAPS - TEST SEC SSI
on:
  push:
    branches: [main]
    paths:
      - "TESTS/**"
      - "SCRIPTS_ACTIFS/*.py"
      - "CONFIG/*.csv"
      - "TESTS/test_sec_ssi_hors_reseau.py"
      - "TESTS/test_companyfacts_sec_hors_reseau.py"
      - "TESTS/test_normalisation_sec_hors_reseau.py"
      - "TESTS/test_rapprochement_sec_ssi_hors_reseau.py"
      - "TESTS/test_gouvernance_sec_hors_reseau.py"
      - "TESTS/test_form4_sec_hors_reseau.py"
      - "TESTS/test_form4_multi_xml_hors_reseau.py"
      - "SCRIPTS_ACTIFS/07Y_EXTRAIRE_FORM4_SEC.py"
      - "SCRIPTS_ACTIFS/07X_INDEX_GOUVERNANCE_SEC.py"
      - "SCRIPTS_ACTIFS/07W_RAPPROCHER_PREUVES_SEC_SSI.py"
      - "SCRIPTS_ACTIFS/07V_NORMALISER_FAITS_SEC.py"
      - "SCRIPTS_ACTIFS/07U_COLLECTE_COMPANYFACTS_SEC.py"
      - "SCRIPTS_ACTIFS/07T_ENRICHIR_PREUVES_SEC_EDGAR.py"
      - ".github/workflows/test_sec_ssi.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - name: Réception SEC et sécurité du pipeline hors réseau
        run: python -B TESTS/executer_tests.py
      - name: Archiver les résultats effectifs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-sec-ssi-${{ github.run_id }}
          path: AUDITS/TESTS/
          if-no-files-found: error
