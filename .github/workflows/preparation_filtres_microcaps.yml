name: MICRO CAPS - PREPARATION FILTRES
on:
  push:
    paths:
      - 'SCRIPTS_ACTIFS/07M_PREPARER_FILTRES_OBJECTIFS.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  filtres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python SCRIPTS_ACTIFS/07M_PREPARER_FILTRES_OBJECTIFS.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DONNEES/UNIVERS_PRET_FILTRES_OBJECTIFS.csv DONNEES/AUDIT_PREPARATION_FILTRES.csv
          git diff --cached --quiet || git commit -m "Prepare filtres objectifs Micro Caps"
          git pull --rebase origin main
          git push origin main
