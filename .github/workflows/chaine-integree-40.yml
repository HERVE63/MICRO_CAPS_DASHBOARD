name: MICRO CAPS - chaine integree 40 titulaires
on:
  workflow_dispatch:
  push:
    branches: [repair/microcaps-chain-20261030]
    paths:
      - '.github/workflows/chaine-integree-40.yml'
      - 'SCRIPTS_ACTIFS/**'
      - 'tests/**'
      - 'DONNEES/REVUE_HEBDOMADAIRE_MCPA_IPS.csv'
      - 'DONNEES/PREUVES_FONDAMENTALES_PUBLIQUES_*.csv'
  schedule:
    - cron: '30 18 * * 2'
permissions:
  contents: write
concurrency:
  group: microcaps-chaine-40
  cancel-in-progress: false
jobs:
  collecte-et-confrontation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/microcaps-chain-20261030
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dependances de controle
        run: python -m pip install pandas pytest requests
      - name: Tester la collecte sans reseau
        run: python -m pytest -q tests/test_09n_collecte_historique_isolee.py
      - name: Tester le collecteur EODHD isole avant collecte
        run: python -B TESTS/test_09d_collecte_non_bloquante.py
      - name: Collecter les historiques EODHD des 40 titulaires avec repli non bloquant
        continue-on-error: true
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_KEY || secrets.EODH_API_KEY }}
        run: python -B SCRIPTS_ACTIFS/09D_COLLECTE_40_TITULAIRES.py
      - name: Collecter les historiques et indicateurs des 40 titulaires
        run: python -B SCRIPTS_ACTIFS/09N_COLLECTE_HISTORIQUES_YAHOO_40.py
      - name: Collecter les fondamentaux SEC si identifiant disponible
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -n "$SEC_USER_AGENT" ]; then
            python -B SCRIPTS_ACTIFS/09K_COLLECTE_SEC_TITULAIRES_US.py
            python -B SCRIPTS_ACTIFS/09L_COLLECTE_SEC_COMPANYFACTS_US.py
          else
            echo 'SEC_USER_AGENT absent : fondamentaux SEC non certifies.'
          fi
      - name: Recollecter les statistiques, profils et bilans publics des 40 titulaires
        continue-on-error: true
        run: |
          set +e
          python -B SCRIPTS_ACTIFS/09V_COLLECTE_STATISTIQUES_40.py
          rc_09v=$?
          python -B SCRIPTS_ACTIFS/09Y_COLLECTE_IDENTITE_CROISSANCE_40.py
          rc_09y=$?
          python -B SCRIPTS_ACTIFS/10A_COLLECTE_BILANS_ANNUELS_40.py
          rc_10a=$?
          echo "COLLECTE_SECONDAIRE_STATUTS 09V=$rc_09v 09Y=$rc_09y 10A=$rc_10a"
          if [ "$rc_09v" -ne 0 ] || [ "$rc_09y" -ne 0 ] || [ "$rc_10a" -ne 0 ]; then
            echo "Collecteur(s) en echec : autres sources executees, preuves a qualifier individuellement."
            exit 1
          fi
      - name: Relier techniques et fondamentaux dans une meme execution
        run: python -B SCRIPTS_ACTIFS/09P_COUVERTURE_PREUVES_40.py
      - name: Preparer les dossiers de preuves des 40 titulaires
        run: python -B SCRIPTS_ACTIFS/09R_PREPARER_DOSSIERS_40.py
      - name: Collecter les complements publics manquants des 40 titulaires
        run: python -B SCRIPTS_ACTIFS/10G_COLLECTE_COMPLEMENTS_PUBLICS_40.py
      - name: Reessayer les valorisations et historiques publics des 40 titulaires
        continue-on-error: true
        run: python -B SCRIPTS_ACTIFS/10I_REESSAYER_VALORISATIONS_HISTORIQUES_40.py
      - name: Enrichir les fiches avec les preuves de marche et publications
        run: python -B SCRIPTS_ACTIFS/09T_ENRICHIR_FICHES_MCPA_40.py
      - name: Importer les complements publics dates dans les champs vides
        run: python -B SCRIPTS_ACTIFS/10H_IMPORTER_COMPLEMENTS_PUBLICS_40.py
      - name: Valider les 40 fiches et preparer la revue MCPA IPS
        run: python -B SCRIPTS_ACTIFS/09S_ADAPTATEUR_FICHES_MCPA_40.py
      - name: Sauvegarder les 40 fiches enrichies dans la branche de travail
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DOSSIERS_MCPA_IPS_40/ DONNEES/REVUE_HEBDOMADAIRE_MCPA_IPS.csv DONNEES/AUDIT_ENRICHISSEMENT_40.csv DONNEES/AUDIT_DOSSIERS_MCPA_IPS_40.csv DONNEES/FICHES_MCPA_IPS_ELIGIBLES_40.csv DONNEES/COMPLEMENTS_PUBLICS_40_*.json DONNEES/COUVERTURE_POURSUITE_40_20261105.csv DONNEES/MATRICE_CHAMPS_POURSUITE_40_20261105.json
          if ! git diff --cached --quiet; then
            git commit -m "data: persist 40 MCPA dossier evidence [skip ci]"
            git push origin HEAD:repair/microcaps-chain-20261030
          else
            echo "Aucune nouvelle donnée à sauvegarder."
          fi
      - name: Diagnostiquer les blocages de notation sans inventer de scores
        run: |
          python - <<'PY'
          import csv,collections
          from pathlib import Path
          p=Path('DONNEES/AUDIT_DOSSIERS_MCPA_IPS_40.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8')))
          assert len(rows)==40, f'Attendu 40 dossiers, obtenu {len(rows)}'
          counts=collections.Counter()
          for row in rows:
            for issue in row['Problemes'].split(' | '):
              if issue.strip():counts[issue.strip()]+=1
          print('DIAGNOSTIC_40_FICHES',len(rows),'PRETES',sum(r['Statut']=='PRET' for r in rows))
          for issue,n in counts.most_common(35):print('BLOCAGE',n,issue)
          print('FICHES_PAR_TICKER')
          for row in rows:print(row['Ticker'],row['Statut'],row['Problemes'][:220])
          PY
      - name: Controle strict et duels uniquement si revue exploitable
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('DONNEES/REVUE_HEBDOMADAIRE_MCPA_IPS.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8')))
          with open('DONNEES/ETAT_VERROU_ARBITRAGE.txt','w',encoding='utf-8') as f:
            f.write(f'FICHES_CERTIFIEES={len(rows)}/40\n')
            f.write('ETAT=REVUE_VIDE_ARBITRAGE_INTERDIT\n' if not rows else 'ETAT=CONTROLE_STRICT_REQUIS\n')
          print('FICHES_CERTIFIEES',len(rows),'SUR 40')
          PY
          if [ "$(wc -l < DONNEES/REVUE_HEBDOMADAIRE_MCPA_IPS.csv)" -le 1 ]; then
            echo 'REVUE_VIDE : aucune note inventee; duels et transactions interdits; collecte et diagnostics conserves.'
          else
            python -B SCRIPTS_ACTIFS/09_CONTROLE_REVUE_MCPA_IPS.py
            python -B SCRIPTS_ACTIFS/09B_DUEL_PROCHAIN_EURO.py
          fi
      - name: Archiver toutes les preuves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microcaps-chaine-40-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            DONNEES/COLLECTE_DIRECTE_40_TITULAIRES.csv
            DONNEES/STATISTIQUES_SECONDAIRES_40_20261104.json
            DONNEES/IDENTITES_CROISSANCE_40_20261104.json
            DONNEES/BILANS_ANNUELS_40_20261104.json
            AUDITS/HISTORIQUE_COLLECTES_HEBDOMADAIRES/COLLECTE_40_*/
            DONNEES/COUVERTURE_HISTORIQUES_YAHOO_40.csv
            DONNEES/INDICATEURS_YAHOO_40.csv
            DONNEES/OBSERVATIONS_SEC_TITULAIRES_US.csv
            DONNEES/FAITS_SEC_TITULAIRES_US.csv
            DONNEES/COUVERTURE_PREUVE_MCPA_40.csv
            DONNEES/DOSSIERS_PREPARATOIRES_40.csv
            DONNEES/AUDIT_DOSSIERS_MCPA_IPS_40.csv
            DONNEES/FICHES_MCPA_IPS_ELIGIBLES_40.csv
            DONNEES/REVUE_HEBDOMADAIRE_MCPA_IPS.csv
            DONNEES/AUDIT_ENRICHISSEMENT_40.csv
            DONNEES/COMPLEMENTS_PUBLICS_40_*.json
            DONNEES/COUVERTURE_POURSUITE_40_20261105.csv
            DONNEES/MATRICE_CHAMPS_POURSUITE_40_20261105.json
            DOSSIERS_MCPA_IPS_40/*.json
            DONNEES/CONTROLE_REVUE_HEBDOMADAIRE_MCPA_IPS.csv
            DONNEES/DUELS_PROCHAIN_EURO.csv
            DONNEES/ETAT_VERROU_ARBITRAGE.txt
