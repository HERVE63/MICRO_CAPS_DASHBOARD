name: Registre primaire AMF rapports manquants
on:
  push:
    branches: [repair/microcaps-chain-20261030]
    paths: [.github/workflows/registre-rapports-amf.yml, SCRIPTS_ACTIFS/10N_REGISTRE_RAPPORTS_AMF_4.py]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: registre-rapports-amf
  cancel-in-progress: false
jobs:
  registre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/microcaps-chain-20261030
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /SCRIPTS_ACTIFS/10N_REGISTRE_RAPPORTS_AMF_4.py
            /DONNEES/DECLARATIONS_AMF_14_20261105.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verifier et consulter les quatre emetteurs
        run: |
          python -m py_compile SCRIPTS_ACTIFS/10N_REGISTRE_RAPPORTS_AMF_4.py
          python SCRIPTS_ACTIFS/10N_REGISTRE_RAPPORTS_AMF_4.py
      - name: Archiver les observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registre-rapports-amf
          path: DONNEES/REGISTRE_RAPPORTS_AMF_4_20261105.json
      - name: Sauvegarder sur la derniere revision sans forcer
        run: |
          cp DONNEES/REGISTRE_RAPPORTS_AMF_4_20261105.json /tmp/registre-rapports.json
          git fetch origin repair/microcaps-chain-20261030
          git checkout --detach FETCH_HEAD
          git sparse-checkout add /DONNEES/REGISTRE_RAPPORTS_AMF_4_20261105.json
          mkdir -p DONNEES
          cp /tmp/registre-rapports.json DONNEES/REGISTRE_RAPPORTS_AMF_4_20261105.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DONNEES/REGISTRE_RAPPORTS_AMF_4_20261105.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: registre AMF exact des rapports a recuperer [skip ci]"
          git push origin HEAD:repair/microcaps-chain-20261030
