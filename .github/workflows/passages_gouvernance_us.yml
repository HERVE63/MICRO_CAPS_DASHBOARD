name: MICRO CAPS - PASSAGES GOUVERNANCE US
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/passages_gouvernance_us.yml']
permissions:
  contents: write
concurrency:
  group: microcaps-passages-gouvernance-us
  cancel-in-progress: false
jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas cryptography
      - name: Réception hors réseau
        run: python -B TESTS/executer_tests.py
      - name: Lire les passages B4 et B5 dans les proxies SEC archivés
        run: python -B SCRIPTS_ACTIFS/07AO_PASSAGES_GOUVERNANCE_US.py
      - name: Vérifier l'intégrité du T0 et des dossiers
        if: always()
        run: |
          python -B SCRIPTS_ACTIFS/07AC_CONTROLER_T0.py
          git diff --exit-code -- DONNEES SAUVEGARDES
      - name: Préserver les sources, dates inconnues et limites de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passages-gouvernance-us-${{ github.run_id }}-${{ github.run_attempt }}
          path: AUDITS/PASSAGES_GOUVERNANCE_US/
      - name: Sauvegarder les résultats effectifs
        if: always()
        run: |
          rapport="AUDITS/TESTS/RUN_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$rapport" AUDITS/PASSAGES_GOUVERNANCE_US
          if [ -f AUDITS/TESTS/RESULTATS_TESTS.json ]; then
            cp AUDITS/TESTS/RESULTATS_TESTS.json "$rapport/RESULTATS_TESTS.json"
            git restore --worktree AUDITS/TESTS/RESULTATS_TESTS.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AUDITS/PASSAGES_GOUVERNANCE_US AUDITS/TESTS
          if ! git diff --cached --quiet; then
            git commit -m 'Passages SEC de gouvernance : contenu à interpréter, aucune note inventée'
            git pull --rebase origin main
            git push origin main
          fi
