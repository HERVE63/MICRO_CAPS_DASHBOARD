name: TEST acces Zonebourse depuis GitHub
on:
  push:
    paths:
      - '.github/workflows/test-zonebourse-acces.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test HTTP et presence des cours sur une page publique
        run: |
          python - <<'PY'
          import urllib.request,re
          url="https://www.zonebourse.com/cours/action/INTELLICHECK-INC-18044767/cotations/"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept-Language":"fr-FR,fr;q=0.9"})
          try:
              with urllib.request.urlopen(req,timeout=25) as r:
                  html=r.read().decode("utf-8","replace")
                  print("HTTP",r.status,"bytes",len(html),"titre_IDN",bool(re.search(r"Intellicheck",html,re.I)),"cours_visible",bool(re.search(r"1[,.]860",html)))
                  if len(html)<3000 or not re.search(r"Intellicheck",html,re.I):raise SystemExit("PAGE_INEXPLOITABLE")
          except Exception as e:
              print("ZONEBOURSE_ACCESS_FAILURE",type(e).__name__,str(e)[:300])
              raise
          PY
