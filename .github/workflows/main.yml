name: MICRO CAPS V3 - PRODUCTION QUOTIDIENNE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/main.yml']
  schedule:
    # Le cron déclencheur détermine la saison ; les retards sont acceptés.
    - cron: "30 20 * * 1-5"
    - cron: "30 21 * * 1-5"

permissions:
  contents: write
concurrency:
  group: microcaps-production-quotidienne
  cancel-in-progress: false

jobs:
  horaire:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.horaire.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: SCRIPTS_ACTIFS/00A_PLANIFICATION_QUOTIDIENNE.py
          sparse-checkout-cone-mode: false
      - name: Choisir le réveil saisonnier sans refuser les retards
        id: horaire
        env:
          MICRO_CAPS_CRON: ${{ github.event.schedule }}
        run: python -B SCRIPTS_ACTIFS/00A_PLANIFICATION_QUOTIDIENNE.py

  moteur:
    needs: horaire
    if: needs.horaire.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dependances
        run: pip install pandas numpy yfinance pandas_market_calendars cryptography
      - name: Réception hors réseau
        run: python -B TESTS/executer_tests.py
      - name: Executer MICRO CAPS V3
        id: moteur
        run: |
          mkdir -p "AUDITS/EXECUTIONS_QUOTIDIENNES/RUN_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          python -u -B SCRIPTS_ACTIFS/00_EXECUTION_QUOTIDIENNE_V3.py 2>&1 | tee "AUDITS/EXECUTIONS_QUOTIDIENNES/RUN_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}/MOTEUR.log"
      - name: Generer le tableau de bord
        id: tableau
        run: python -B SCRIPTS_ACTIFS/08_GENERER_DASHBOARD.py
      - name: Contrôler l'intégrité des références T0
        if: always()
        id: t0
        run: python -B SCRIPTS_ACTIFS/07AC_CONTROLER_T0.py
      - name: Préserver le résultat réel et les diagnostics
        if: always()
        env:
          MC_MOTEUR: ${{ steps.moteur.outcome }}
          MC_TABLEAU: ${{ steps.tableau.outcome }}
          MC_T0: ${{ steps.t0.outcome }}
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          from datetime import datetime, timezone
          import os, json, hashlib, shutil
          base=Path('.')
          out=base/'AUDITS/EXECUTIONS_QUOTIDIENNES'/('RUN_'+os.environ['GITHUB_RUN_ID']+'_'+os.environ['GITHUB_RUN_ATTEMPT'])
          out.mkdir(parents=True,exist_ok=True)
          for p in (base/'DONNEES').glob('TEST_*V3.csv'):
              shutil.copy2(p,out/p.name)
          rapport=base/'AUDITS/TESTS/RESULTATS_TESTS.json'
          if rapport.exists(): shutil.copy2(rapport,out/'RESULTATS_TESTS.json')
          bilan={'date_utc':datetime.now(timezone.utc).isoformat(),'commit_declencheur':os.environ['GITHUB_SHA'],
              'moteur':os.environ.get('MC_MOTEUR'),'tableau':os.environ.get('MC_TABLEAU'),'integrite_T0':os.environ.get('MC_T0'),
              'copies_csv':'INSTANTANE_DES_FICHIERS_PRESENTS_NON_VALIDE_SI_MOTEUR_EN_ECHEC',
              'fichiers':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir() if p.is_file()}}
          (out/'STATUT.json').write_text(json.dumps(bilan,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(bilan,ensure_ascii=False))
          PYTHON
          git restore --worktree AUDITS/TESTS/RESULTATS_TESTS.json
      - name: Archiver les preuves de cette exécution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quotidien-${{ github.run_id }}-${{ github.run_attempt }}
          path: AUDITS/EXECUTIONS_QUOTIDIENNES/RUN_${{ github.run_id }}_${{ github.run_attempt }}/
      - name: Sauvegarder les résultats validés ou seulement le diagnostic d'échec
        if: always()
        env:
          MC_MOTEUR: ${{ steps.moteur.outcome }}
          MC_TABLEAU: ${{ steps.tableau.outcome }}
          MC_T0: ${{ steps.t0.outcome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AUDITS/EXECUTIONS_QUOTIDIENNES
          if [ "$MC_MOTEUR" = success ] && [ "$MC_TABLEAU" = success ] && [ "$MC_T0" = success ]; then
            git add DONNEES HISTORIQUE index.html APPLICATION/index.html
          else
            git restore --worktree DONNEES HISTORIQUE index.html APPLICATION/index.html
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Exécution quotidienne Micro Caps : résultats validés et diagnostic effectif'
            git pull --rebase origin main
            git push origin main
          fi
