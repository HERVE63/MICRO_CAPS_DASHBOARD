name: MICRO CAPS V3 - TEST MOTEUR

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

jobs:
  moteur:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance pandas_market_calendars

      - name: Executer MICRO CAPS V3
        run: python SCRIPTS_ACTIFS/00_EXECUTION_QUOTIDIENNE_V3.py
      - name: Sauvegarder les résultats MICRO CAPS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DONNEES HISTORIQUE
          if git diff --cached --quiet; then
            echo "Aucun nouveau résultat à sauvegarder."
          else
            git commit -m "Mise à jour automatique MICRO CAPS"
            git push
          fi
