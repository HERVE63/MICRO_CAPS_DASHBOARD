name: MICRO CAPS - PREPARER DOSSIERS SSI
on:
  push:
    paths:
      - 'SCRIPTS_ACTIFS/07Q_PREPARER_DOSSIERS_SSI.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ssi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python SCRIPTS_ACTIFS/07Q_PREPARER_DOSSIERS_SSI.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DONNEES/DOSSIERS_SSI_A_QUALIFIER.csv DONNEES/AUDIT_DOSSIERS_SSI.csv
          git diff --cached --quiet || git commit -m "Prepare dossiers SSI Micro Caps"
          git pull --rebase origin main
          git push origin main
