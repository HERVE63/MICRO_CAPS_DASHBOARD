name: MICRO CAPS - AUDIT CHAINE COMPLETE (BRANCHE)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit strict sans modification des données
        run: python -B SCRIPTS_ACTIFS/08C_AUDIT_CHAINE_COMPLETE.py
